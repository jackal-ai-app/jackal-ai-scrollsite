  <meta charset="UTF-8" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --graphite:  #111111;
      --iron:      #2A2A28;
      --dust:      #B8A88E;
      --sandstone: #E5D5BE;
      --amber:     #F59E0B;
      --amber-dark:#D97706;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--graphite);
      color: var(--sandstone);
      font-family: 'Outfit', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .card {
      background: var(--iron);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 480px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 400;
      line-height: 1.2;
      color: var(--sandstone);
      margin-bottom: 12px;
    }

    .subhead {
      font-size: 15px;
      color: var(--dust);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    audio {
      width: 100%;
      margin-bottom: 24px;
      border-radius: 6px;
      accent-color: var(--amber);
    }

    .cta-btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      background: var(--amber);
      color: #111;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .cta-btn:hover {
      background: var(--amber-dark);
    }

    :focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
      border-radius: 2px;
    }
  </style>
</head>

  <div class="card">
    <span class="eyebrow">Live Demo Call</span>
    <h1>Hear Jackal AI answer a tradie call</h1>
    <p class="subhead">This is what your callers hear when you're on the tools. Real Australian voice. No scripts that sound robotic.</p>

    <audio controls preload="none">
      <source src="../assets/Demo-Call.MP3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <a href="https://jackalai.app/consultation" class="cta-btn">Book your free consult &rarr;</a>
  </div>
